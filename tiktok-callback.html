<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok connected</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; background: #111; color: #eee; margin: 0; padding: 40px 16px; }
  main { max-width: 560px; margin: auto; }
  code { display: block; background: #222; padding: 14px; border-radius: 8px; word-break: break-all; margin: 12px 0; }
  button { font: inherit; padding: 8px 16px; border-radius: 8px; border: 0; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>Copy this code</h1>
  <p>Paste it into: <b>autopilot.py tiktok-login --code CODE</b></p>
  <code id="code">No code in the link.</code>
  <button onclick="navigator.clipboard.writeText(document.getElementById('code').textContent)">Copy</button>
</main>
<script>
  const p = new URLSearchParams(location.search);
  const el = document.getElementById("code");
  if (p.get("code")) el.textContent = p.get("code");
  else if (p.get("error")) el.textContent = "Error: " + p.get("error") + " " + (p.get("error_description") || "");
</script>
</body>
</html>
